name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '24'

permissions:
  contents: read

jobs:
  # Validate environment and dependencies
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate environment variables
        run: |
          echo "Checking required environment variable definitions..."
          # Check that .env.example exists and has all required vars documented
          if [ ! -f .env.example ]; then
            echo "Error: .env.example file not found"
            exit 1
          fi
          echo "Environment validation passed"

      - name: Check for security vulnerabilities
        run: npm audit --audit-level=high || true

  # Linting and type checking
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      # eslint, design-system check (DESIGN.md rules + legacy ratchet), tsc.
      - name: Verify (lint)
        run: npm run verify -- lint

  # Unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkflame
          POSTGRES_PASSWORD: linkflame
          POSTGRES_DB: linkflame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U linkflame -d linkflame_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify (unit)
        run: npm run verify -- unit
        env:
          DATABASE_URL: postgresql://linkflame:linkflame@localhost:5432/linkflame_test?schema=public
          DIRECT_URL: postgresql://linkflame:linkflame@localhost:5432/linkflame_test?schema=public

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # E2E tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkflame
          POSTGRES_PASSWORD: linkflame
          POSTGRES_DB: linkflame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U linkflame -d linkflame_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # prisma db push + seed, then Playwright against a production build.
      - name: Verify (e2e)
        run: npm run verify -- e2e
        env:
          DATABASE_URL: postgresql://linkflame:linkflame@localhost:5432/linkflame_test?schema=public
          DIRECT_URL: postgresql://linkflame:linkflame@localhost:5432/linkflame_test?schema=public
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-production
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7

  # Build verification
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      # next build, then the inline-script CSP hashes against what that build
      # serves (next-themes' script text comes from the minified server bundle).
      - name: Verify (build)
        run: npm run verify -- build
        env:
          DATABASE_URL: postgresql://linkflame:linkflame@localhost:5432/linkflame_test?schema=public
          DIRECT_URL: postgresql://linkflame:linkflame@localhost:5432/linkflame_test?schema=public
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: build-secret-for-ci-only
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1

  # Lighthouse score floors on the public routes, against the production
  # build served with the same Postgres service + seed the E2E job uses.
  # Floors live in scripts/check-lighthouse-score.mjs, along with a
  # compressed-byte cap on the home document (experimental.inlineCss made
  # the HTML carry the stylesheet, and a score alone would not notice it
  # slowly growing). Desktop preset: mobile throttling is too noisy on
  # shared runners; production mobile numbers are measured separately.
  lighthouse:
    name: Lighthouse (score floors)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkflame
          POSTGRES_PASSWORD: linkflame
          POSTGRES_DB: linkflame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U linkflame -d linkflame_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://linkflame:linkflame@localhost:5432/linkflame_test?schema=public
      DIRECT_URL: postgresql://linkflame:linkflame@localhost:5432/linkflame_test?schema=public
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: lighthouse-secret-for-ci-only-not-production
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      # prisma db push + seed, next build, next start on :3000, score floors.
      # The server is started and stopped (log printed on failure) by verify.
      - name: Verify (lighthouse)
        run: npm run verify -- lighthouse

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-artifacts
          path: artifacts/lighthouse
          retention-days: 7

  # Database migration check (dry run)
  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for pending migrations
        run: |
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code || echo "Schema changes detected - migration may be needed"
        env:
          DATABASE_URL: postgresql://linkflame:linkflame@localhost:5432/linkflame_test?schema=public
          DIRECT_URL: postgresql://linkflame:linkflame@localhost:5432/linkflame_test?schema=public
